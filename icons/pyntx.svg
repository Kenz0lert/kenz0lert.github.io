<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Pyntx app icon: logo B "Спутник" (monogram P with a glowing core and a satellite), monochrome, GitHub-style. -->
  <circle cx="256" cy="256" r="256" fill="#0d1117"/>
  <g transform="translate(77 66) scale(5.6)">
    <!-- the satellite's orbit -->
    <path d="M11.9 37.95a22 8 -24 1 0 40.2 -17.9a22 8 -24 1 0 -40.2 17.9" fill="none" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1.3"/>
    <!-- the letter P -->
    <path d="M21 53V15h12a11.5 11.5 0 0 1 0 23H21" fill="none" stroke="#ffffff" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- the core in the counter of the P -->
    <circle cx="32.6" cy="26.5" r="4.8" fill="#ffffff"/>
    <!-- the satellite, with a dark rim so it stands apart from the letter -->
    <circle cx="50.57" cy="18.47" r="3.1" fill="#ffffff" stroke="#0d1117" stroke-width="1.6"/>
  </g>
</svg>
